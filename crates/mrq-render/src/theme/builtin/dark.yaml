# Built-in theme `dark`: light text on a dark background, otherwise `light`.
extends: light
colors:
  foreground: "#d4d4d4"
  background: "#1e1e1e"
  heading: "#f0f0f0"
  accent: "#6cb6ff"
  muted: "#9a9a9a"
  border: "#3c3c3c"
  code_foreground: "#d4d4d4"
  code_background: "#2a2a2a"
  alerts:
    note: "#4493f8"
    tip: "#3fb950"
    important: "#ab7df8"
    warning: "#d29922"
    caution: "#f85149"
code:
  theme: "base16-ocean.dark"
