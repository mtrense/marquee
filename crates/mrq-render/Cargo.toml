[package]
name = "mrq-render"
description = "Render backends for mrq"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["dot", "png"]
# The built-in Mermaid renderer (`MermaidRenderer`): merman to SVG and ASCII/Unicode text,
# without its EPL-licensed ELK layout and its math fonts. Off by default, it is heavy.
mermaid = ["dep:merman"]
# The built-in DOT/Graphviz renderer (`DotRenderer`): layout-rs to SVG.
dot = ["dep:layout-rs"]
# SVG-to-PNG rasterization with resvg (`rasterize`, and PNG from any renderer that makes
# SVG), drawing text with the system fonts.
png = ["dep:resvg"]
# Diagrams from a Kroki server (`KrokiRenderer`) via reqwest with rustls (ring provider,
# never OpenSSL) on a tokio runtime of its own. Off by default; even when built, Kroki is
# never contacted unless `render.diagrams.kroki.enabled` is set.
kroki = ["dep:reqwest", "dep:rustls", "dep:tokio"]
# The PDF backend (`PdfRenderer`): the mrq AST as Typst markup, compiled in-process by
# Typst with its bundled fonts (Libertinus Serif, New Computer Modern, DejaVu Sans Mono)
# and Noto Color Emoji (assets/fonts, SIL OFL 1.1) embedded in the binary. Off by default, it is heavy.
pdf = ["dep:typst", "dep:typst-layout", "dep:typst-pdf", "dep:typst-assets"]

[dependencies]
mrq-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
syntect = { workspace = true, features = ["parsing", "regex-fancy", "plist-load", "html"] }
two-face = { workspace = true, features = ["syntect-fancy"] }
pulldown-latex.workspace = true
unicode-width.workspace = true
ring.workspace = true
roff.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
merman = { workspace = true, optional = true, features = ["all-diagrams", "svg", "layout-cytoscape", "ascii"] }
layout-rs = { workspace = true, optional = true }
resvg = { workspace = true, optional = true, features = ["text", "system-fonts", "memmap-fonts"] }
typst = { workspace = true, optional = true }
typst-layout = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-assets = { workspace = true, optional = true, features = ["fonts"] }

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true
insta.workspace = true
regex.workspace = true
pdf-extract.workspace = true

[lints]
workspace = true
