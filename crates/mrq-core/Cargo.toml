[package]
name = "mrq-core"
description = "Core library of mrq: parse, query, validate, lint and format Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The vendored spec files are CC BY-SA test data, not part of the published crate.
exclude = ["tests/fixtures/spec"]

[features]
default = ["human"]
# Graphical (miette) rendering of human-readable diagnostics. Without it, the human
# format falls back to one plain `file:line:col: severity[code]: message` line per diagnostic.
human = ["dep:miette", "miette/fancy-no-syscall"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
miette = { workspace = true, optional = true }
ignore.workspace = true
globset.workspace = true
figment.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
comrak.workspace = true
toml_edit.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
jsonschema.workspace = true
tempfile.workspace = true

[lints]
workspace = true
