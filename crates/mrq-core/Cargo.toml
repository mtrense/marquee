[package]
name = "mrq-core"
description = "Core library of mrq: parse, query, validate, lint and format Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Vendored test data under other licences (CC BY-SA spec files, ISC github-slugger corpus)
# is not part of the published crate.
exclude = ["tests/fixtures/spec", "tests/fixtures/slug"]

[features]
default = ["human", "frontmatter-schema"]
# Graphical (miette) rendering of human-readable diagnostics. Without it, the human
# format falls back to one plain `file:line:col: severity[code]: message` line per diagnostic.
human = ["dep:miette", "miette/fancy-no-syscall"]
# Frontmatter JSON Schema checks (`validate.frontmatter`) via jsonschema, built without its
# default features: no HTTP or file `$ref` retrieval, so validation never touches the network.
frontmatter-schema = ["dep:jsonschema"]
# External http(s) link checks (`HttpChecker`) via reqwest with rustls (ring provider, never
# OpenSSL) on a tokio runtime of its own. Off by default; even when built, nothing is
# requested unless a caller enables the checks.
external-links = ["dep:reqwest", "dep:rustls", "dep:tokio", "dep:futures-util"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
miette = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
ignore.workspace = true
globset.workspace = true
figment.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
comrak.workspace = true
entities.workspace = true
toml_edit.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
winnow.workspace = true
jaq-core.workspace = true
jaq-std.workspace = true
jaq-json.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
jsonschema.workspace = true
tempfile.workspace = true

[lints]
workspace = true
