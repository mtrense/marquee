[package]
name = "mrq-cli"
description = "mrq: a Swiss-army knife for Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mrq"
path = "src/main.rs"

[features]
# Checking external http(s) links (wired to `mrq validate --external` in M4.6).
external-links = ["mrq-core/external-links"]

[dependencies]
mrq-core.workspace = true
mrq-render.workspace = true
mrq-tui.workspace = true
mrq-lsp.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true

[lints]
workspace = true
