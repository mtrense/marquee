[package]
name = "mrq-cli"
description = "mrq: a Swiss-army knife for Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mrq"
path = "src/main.rs"

[features]
default = ["frontmatter-schema", "external-links", "remote-include", "tree-sitter"]
# Frontmatter JSON Schema checks in `mrq validate` (`validate.frontmatter`); without it the
# setting is ignored with a warning.
frontmatter-schema = ["mrq-core/frontmatter-schema"]
# Checking external http(s) links with `mrq validate --external` (or `validate.external`).
# On by default, so release binaries can do it; nothing is requested unless asked for.
external-links = ["mrq-core/external-links"]
# `mrq:include` from http(s) URLs, and `sha256` pins. On by default; nothing is fetched
# unless `include.allow_remote` is set.
remote-include = ["mrq-core/remote-include"]
# Symbol code includes (`function="main"`) via tree-sitter grammars. On by default; without
# it, an include selecting a symbol fails with a diagnostic.
tree-sitter = ["mrq-core/tree-sitter"]
# The built-in Mermaid renderer (merman), so `mermaid` diagrams need no Node.js `mmdc`.
# The built-in DOT renderer and PNG rasterization are always on (mrq-render's defaults).
mermaid = ["mrq-render/mermaid"]
# `mrq render -o pdf`: embedded Typst with its bundled fonts. Off by default, it is heavy.
pdf = ["mrq-render/pdf"]

[dependencies]
mrq-core.workspace = true
mrq-render.workspace = true
mrq-tui.workspace = true
mrq-lsp.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
tempfile.workspace = true
similar.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true

[lints]
workspace = true
