# cargo-deny configuration (v2 config schema, cargo-deny >= 0.18).
#
# Note for future editors: the v1 keys `vulnerability`, `unsoundness`, `notice`,
# `copyleft`, `allow-osi-fsf-free` and `default` no longer exist. Security
# advisories are unconditionally errors in the v2 schema, and licenses are
# strictly allow-listed. Do not re-add those keys — cargo-deny hard-errors on
# unknown fields.

[graph]
# Resolve with every feature enabled, so optional dependencies are checked too.
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
  # bincode 1.x is unmaintained (no vulnerability); syntect needs it to load its
  # syntax and theme dumps (mrq_render::highlight), and has no release without it.
  { id = "RUSTSEC-2025-0141", reason = "unmaintained, no fix; required by syntect" },
  # The PDF backend (feature `pdf`): Typst 0.15 has no release without these.
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, no fix; Typst's text shaping" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no fix; Typst's font parsing" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (proc macro), no fix; via Typst's hayagriva" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, no fix; via Typst's serde_yaml" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, no fix; via the syntect features Typst enables" },
  # quick-xml 0.38 in citationberg (Typst's CSL styles): only bibliography and CSL files
  # are parsed with it, and the markup mrq generates never loads one.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 pinned by citationberg; only CSL/bibliography XML" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 pinned by citationberg; only CSL/bibliography XML" },
]

[licenses]
# Only licenses that actually appear in the resolved graph (verify with
# `cargo deny list`); keep this list tight.
allow = [
  "MIT",
  "Apache-2.0",
  # unicode-ident is "(MIT OR Apache-2.0) AND Unicode-3.0".
  "Unicode-3.0",
]
unused-allowed-license = "warn"
confidence-threshold = 0.93
exceptions = [
  # "(Apache-2.0 OR MIT) AND BSD-3-Clause" (WHATWG-derived data); pulled in by serde-saphyr.
  { allow = ["BSD-3-Clause"], crate = "encoding_rs" },
  # The Markdown parser behind `mrq_core::parse`.
  { allow = ["BSD-2-Clause"], crate = "comrak" },
  # "(MIT OR Apache-2.0) AND Unicode-DFS-2016" (Unicode data tables); pulled in by comrak.
  { allow = ["Unicode-DFS-2016"], crate = "finl_unicode" },
  # hashbrown's default hasher; pulled in by indexmap via toml_edit (TOML frontmatter).
  { allow = ["Zlib"], crate = "foldhash" },
  # MIT No Attribution; pulled in by jsonschema (via fluent-uri) for frontmatter schemas.
  { allow = ["MIT-0"], crate = "borrow-or-share" },
  # The TLS stack of the `external-links` feature (reqwest + rustls with the ring provider).
  { allow = ["ISC"], crate = "ring" },
  { allow = ["ISC"], crate = "untrusted" },
  { allow = ["ISC"], crate = "rustls-webpki" },
  { allow = ["BSD-3-Clause"], crate = "subtle" },
  # Mozilla's root certificates as data; rustls-platform-verifier's fallback trust store.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
  # Servo's CSS parser, used unmodified (MPL-2.0 is file-level copyleft: changes to its own
  # files would have to be shared); pulled in by merman (feature `mermaid`).
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  # The rasterizer of resvg (feature `png`), and its helpers.
  { allow = ["BSD-3-Clause"], crate = "tiny-skia" },
  { allow = ["BSD-3-Clause"], crate = "tiny-skia-path" },
  { allow = ["BSD-2-Clause"], crate = "arrayref" },
  # fontdb's face storage; pulled in by resvg (feature `png`).
  { allow = ["Zlib"], crate = "slotmap" },
  # The PDF backend (feature `pdf`, Typst). psm (stack switching for typst-eval's
  # stacker) builds its assembly with this archive writer at build time only.
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer" },
  # EXIF orientation of raster images in typst-library, and its helper.
  { allow = ["BSD-2-Clause"], crate = "kamadak-exif" },
  { allow = ["BSD-2-Clause"], crate = "mutate_once" },
  # Roman page and list numbering; pulled in by typst-library via hayagriva/biblatex.
  { allow = ["0BSD"], crate = "roman-numerals-rs" },
  # flate2's pure-Rust zlib backend; compresses typst-pdf's streams.
  { allow = ["Zlib"], crate = "zlib-rs" },
]

[licenses.private]
# Internal crates (`publish = false`) are not license-checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Release binaries use rustls; no target may need a system TLS library.
deny = [
  { crate = "openssl-sys", reason = "use rustls; release binaries must not link OpenSSL" },
  { crate = "openssl", reason = "use rustls; release binaries must not link OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
