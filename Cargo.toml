[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Max Trense"]
repository = "https://github.com/mtrense/marquee"

[workspace.dependencies]
mrq-core = { path = "crates/mrq-core", version = "0.1.0" }
mrq-render = { path = "crates/mrq-render", version = "0.1.0" }
mrq-tui = { path = "crates/mrq-tui", version = "0.1.0" }
mrq-lsp = { path = "crates/mrq-lsp", version = "0.1.0" }
mrq-cli = { path = "crates/mrq-cli", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
assert_cmd = "2"
predicates = "3"
insta = "1.49.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
miette = { version = "7.6.0", default-features = false }
jsonschema = { version = "0.60.2", default-features = false }
ignore = "0.4.34"
globset = "0.4.21"
figment = { version = "0.10.19", default-features = false }
schemars = "1.2.3"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "serialize", "comments"] }
comrak = { version = "0.59.0", default-features = false }
entities = "1.0.1"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
textwrap = { version = "0.16.4", default-features = false, features = ["smawk"] }
regex = "1.13.1"
winnow = "1.0.4"
jaq-core = "3.1.2"
jaq-std = "3.0.4"
jaq-json = "2.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "0.17.14", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tower-lsp-server = "0.23.0"
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
tree-sitter = "0.27.1"
streaming-iterator = "0.1.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
syntect = { version = "5.3.0", default-features = false }
two-face = { version = "0.5.2", default-features = false }
pulldown-latex = { version = "0.8.0", default-features = false }
merman = { version = "0.9.3", default-features = false }
layout-rs = { version = "0.1.3", default-features = false }
resvg = { version = "0.49.0", default-features = false }
roff = "1.1.1"
terminal_size = "0.4.4"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = "0.15.1"
pdf-extract = "0.12.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
notify = "8.2.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
