[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Max Trense"]
repository = "https://github.com/mtrense/marquee"

[workspace.dependencies]
mrq-core = { path = "crates/mrq-core", version = "0.1.0" }
mrq-render = { path = "crates/mrq-render", version = "0.1.0" }
mrq-tui = { path = "crates/mrq-tui", version = "0.1.0" }
mrq-lsp = { path = "crates/mrq-lsp", version = "0.1.0" }
mrq-cli = { path = "crates/mrq-cli", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
assert_cmd = "2"
predicates = "3"
insta = "1.49.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
miette = { version = "7.6.0", default-features = false }
jsonschema = { version = "0.60.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
